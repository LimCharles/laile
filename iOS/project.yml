name: Laile
options:
  bundleIdPrefix: app.laile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # set your Apple Developer Team ID for device/TestFlight builds
packages:
  LaileKit:
    path: ../Packages/LaileKit
targets:
  Laile:
    type: application
    platform: iOS
    sources:
      - path: Laile
        excludes:
          - Resources/Cues
      - path: Laile/Resources/Cues
        type: folder
        buildPhase: resources
    dependencies:
      - package: LaileKit
        product: LaileKit
    info:
      path: Laile/Info.plist
      properties:
        CFBundleDisplayName: Laile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        NSCameraUsageDescription: "Laile uses the camera to count your reps and measure your joint angles. Video never leaves your phone."
        NSMicrophoneUsageDescription: "Talk to your coach mid-exercise — say if something feels tight, sore or wrong."
        NSSpeechRecognitionUsageDescription: "Laile turns what you say during exercise (like \"sharp pain in my knee\") into notes and safety checks."
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.laile.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
