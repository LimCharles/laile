name: Laile
options:
  bundleIdPrefix: app.laile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: N6H24FPDS2
packages:
  LaileKit:
    path: ../Packages/LaileKit
targets:
  Laile:
    type: application
    platform: iOS
    sources:
      - path: Laile
        excludes:
          - Resources/Cues
      - path: Laile/Resources/Cues
        type: folder
        buildPhase: resources
    dependencies:
      - package: LaileKit
        product: LaileKit
    info:
      path: Laile/Info.plist
      properties:
        CFBundleDisplayName: Laile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Laile uses the camera to count your reps and measure your joint angles. Video stays on your phone."
        NSMicrophoneUsageDescription: "Talk to your coach mid-exercise. Say if something feels tight, sore or wrong."
        NSSpeechRecognitionUsageDescription: "Laile turns what you say during exercise (like \"sharp pain in my knee\") into notes and safety checks."
        ITSAppUsesNonExemptEncryption: false
        LaileAPIBaseURL: $(LAILE_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.laile.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
      configs:
        # The hosted Laile API this build talks to. Debug → local server (Simulator reaches the Mac).
        Debug:
          LAILE_API_BASE_URL: http://127.0.0.1:8080
        # Release (Archive, TestFlight) → the Laile server on Tencent Cloud Lighthouse (deploy/).
        Release:
          LAILE_API_BASE_URL: https://43-156-108-79.sslip.io
